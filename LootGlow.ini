[LootGlow]

; ============================================================
; LootGlow
; Highlights loot containers based on valuable contents.
; ============================================================


; ============================================================
; Core behavior
; ============================================================

; Add item values together when deciding a container's loot tier.
; Example: five 20-gold items count as 100 total value.
; 1 = enabled, 0 = disabled
AggregateMode=1

; Defensive visual refresh when a container's graphics load or reload.
; Recommended: 1
; 1 = enabled, 0 = disabled
VisualRefreshMode=1

; Glow restoration following cell transitions.
; An active FullReinitMode requires the matching DualReinitMode to be active
; Recommended: 1
; 1 = enabled, 0 = disabled

; Restore full intensity for tracked single-shader glows with more than one stack.
; Covers Low, Medium, High, and standalone Lockpick glows.
SingleShaderFullReinitMode=1

; Opt-in normalization for saves with duplicated LootGlow effects.
; Glow still applies automatically on graphics load. On the next hover, this
; checks for extra matching shader effects and, if found, requests their
; removal before rebuilding the configured stack plan on a later hover.
; Enable only for affected saves that reload with doubled effects; a saved
; correction alone has not prevented this build from adding fresh stacks on
; the next load. Leave at 0 unless an affected save needs normalization.
; 1 = enabled, 0 = disabled
LegacyGlowNormalizationMode=0

; Restore both shaders and full intensity for the Insane and Unique dual-shader tiers.
UniqueItemDualReinitMode=1
UniqueItemFullReinitMode=1

InsaneTierDualReinitMode=1
InsaneTierFullReinitMode=1


; ============================================================
; Unique items
; ============================================================

; Containers with known unique/artifact items use a special Unique glow.
; Unique items take priority over normal value tiers and lockpicks.
; 1 = enabled, 0 = disabled
UniqueItemMode=1


; ============================================================
; Value tiers
; ============================================================

; Minimum total value needed for each glow tier.
LowTierThreshold=50
MediumTierThreshold=100
HighTierThreshold=300
InsaneTierThreshold=1000


; ============================================================
; Lockpicks
; ============================================================

; Containers with lockpicks use a Lockpick glow only when they do not
; already qualify for Unique or value-tier glow.
; 1 = enabled, 0 = disabled
LockpickMode=1
